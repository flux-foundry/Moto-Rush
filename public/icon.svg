<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#1a1a1a"/>
  
  <!-- Road lines -->
  <rect x="246" y="0" width="20" height="100" fill="#444"/>
  <rect x="246" y="160" width="20" height="100" fill="#444"/>
  <rect x="246" y="320" width="20" height="100" fill="#444"/>
  <rect x="246" y="480" width="20" height="32" fill="#444"/>

  <!-- Bike Shadow -->
  <rect x="226" y="156" width="80" height="200" rx="15" fill="#000" opacity="0.4"/>
  
  <!-- Tires -->
  <rect x="240" y="126" width="32" height="64" rx="8" fill="#111"/> 
  <rect x="240" y="326" width="32" height="74" rx="8" fill="#111"/>
  
  <!-- Bike Body -->
  <path d="M 216 196 L 296 196 L 286 316 L 226 316 Z" fill="#e53935"/>
  <path d="M 226 216 L 286 216 L 276 296 L 236 296 Z" fill="#b71c1c"/>
  
  <!-- Handlebars -->
  <rect x="196" y="186" width="120" height="12" rx="6" fill="#757575"/>
  <rect x="186" y="166" width="20" height="40" rx="6" fill="#212121"/>
  <rect x="306" y="166" width="20" height="40" rx="6" fill="#212121"/>
  
  <!-- Rider Helmet -->
  <circle cx="256" cy="246" r="32" fill="#111"/>
  <path d="M 230 250 Q 256 266 282 250 L 276 226 L 236 226 Z" fill="#444"/> <!-- Visor -->
  <!-- Helmet highlight -->
  <circle cx="248" cy="238" r="8" fill="#333"/>
</svg>
