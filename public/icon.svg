<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- Road Background -->
  <rect width="100" height="100" fill="#2d3436" />
  
  <!-- Lane Markers -->
  <rect x="47" y="0" width="6" height="20" fill="#ecf0f1" opacity="0.6" />
  <rect x="47" y="40" width="6" height="20" fill="#ecf0f1" opacity="0.6" />
  <rect x="47" y="80" width="6" height="20" fill="#ecf0f1" opacity="0.6" />

  <!-- Asset Colors -->
  <defs>
    <style>
      .shadow { fill: rgba(0,0,0,0.4); }
      .tire { fill: #111; }
      .forks { fill: #7f8c8d; }
      .handlebar { fill: #222; }
      .grips { fill: #e74c3c; }
      .body { fill: #e74c3c; }
      .windshield { fill: #34495e; }
      .tank { fill: #c0392b; }
      .exhaust-main { fill: #95a5a6; }
      .exhaust-tip { fill: #2c3e50; }
      .pants { fill: #2980b9; stroke: #2980b9; stroke-width: 6.4; stroke-linecap: round; stroke-linejoin: round; }
      .jacket { fill: #34495e; stroke: #34495e; stroke-width: 5.6; stroke-linecap: round; stroke-linejoin: round; }
      .helmet { fill: #f1c40f; }
      .visor { fill: #111; }
    </style>
  </defs>

  <g transform="translate(0, -6)">
    <!-- Shadow -->
    <ellipse cx="58" cy="66" rx="16" ry="40" class="shadow" />

    <!-- Front Wheel -->
    <rect x="46" y="14" width="8" height="20" rx="2" class="tire" />

    <!-- Forks -->
    <rect x="44" y="26" width="2" height="12" class="forks" />
    <rect x="54" y="26" width="2" height="12" class="forks" />

    <!-- Handlebars and Grips -->
    <rect x="36" y="35.6" width="28" height="1.6" class="handlebar" />
    <rect x="34" y="34.8" width="4" height="3.2" rx="1" class="grips" />
    <rect x="62" y="34.8" width="4" height="3.2" rx="1" class="grips" />

    <!-- Chassis -->
    <polygon points="50,30 62,46 56,66 44,66 38,46" class="body" />

    <!-- Windshield -->
    <polygon points="50,32.4 56,42 44,42" class="windshield" />

    <!-- Gas Tank -->
    <ellipse cx="50" cy="54" rx="8" ry="12" class="tank" />

    <!-- Rear Seat / Tail -->
    <polygon points="44,62 56,62 52,86 48,86" class="body" />

    <!-- Exhaust -->
    <rect x="56" y="70" width="4" height="20" rx="1" class="exhaust-main" />
    <rect x="56.8" y="88.4" width="2.4" height="4" class="exhaust-tip" />

    <!-- Rear Wheel -->
    <rect x="46" y="82" width="8" height="20" rx="2" class="tire" />

    <!-- Rider Legs -->
    <polyline points="42,74 36,62 42,70" class="pants" fill="none" />
    <polyline points="58,74 64,62 58,70" class="pants" fill="none" />

    <!-- Rider Body/Jacket -->
    <!-- Lower back -->
    <ellipse cx="50" cy="70" rx="8" ry="8" class="jacket" />
    <!-- Shoulders -->
    <ellipse cx="50" cy="58" rx="11.2" ry="9.6" class="jacket" />

    <!-- Arms -->
    <polyline points="40,58 36,46 38,35.6" class="jacket" fill="none" />
    <polyline points="60,58 64,46 62,35.6" class="jacket" fill="none" />

    <!-- Helmet -->
    <ellipse cx="50" cy="50" rx="8.8" ry="9.6" class="helmet" />
    <ellipse cx="50" cy="46" rx="6.4" ry="4.8" class="visor" />
  </g>
</svg>
